<!DOCTYPE html>
<html lang="en">

<head>
    <title>
        Login page
    </title>
    <link rel="stylesheet" href="styl.css">
</head>

<body>


    <main>



        <section class="left">

            <div class="part1">
                <h1 id="logIn">
                    Log In
                </h1>

                <p id="logInPara">Push your limits. Log in and and level up!</p>

            </div>

            <form class="part2">


                <label for="email">Email</label>
                <input type="email" id="email">

                <br>

                <label for="password">Password</label>
                <input type="password" id="password">


                <a href="" id="forgotPassword">Forgot password?</a>

                <br><br>

                <button>Login</button>

            </form>


            <div class="part3">

                <div class="bottomText">
                    <p>
                        ----------Or Log In with----------
                    </p>
                </div>

                <div class="bottomOptions">
                    <div class="google">
                        <div id="googleLogo">
                            <img src="google-logo-analytics-g-suite-brand.jpg" alt="G" id="googleImage">
                        </div>
                        <a href="">Google</a>
                    </div>

                    <div class="facebook">
                        <div id="facebookLogo">
                            <img src="Facebook-Logo.png" alt="F">
                        </div>
                        <a href="">Facebook</a>
                    </div>

                </div>






            </div>


        </section>

        <section class="right">

            <img src="Screenshot 2025-04-30 100544.png" alt="Gym girl Image">

        </section>

    </main>


</body>

</html>
